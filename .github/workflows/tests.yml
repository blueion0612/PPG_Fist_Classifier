name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest
      - name: Unit tests, and the README numbers against results.json
        run: python -m pytest -q
      - name: Every entry point resolves, as a module and as a command
        run: |
          for m in preprocessor train evaluate realtime; do
            python -m ppg_fist_classifier."$m" --help > /dev/null
          done
          for c in ppg-preprocess ppg-train ppg-evaluate ppg-realtime; do
            "$c" --help > /dev/null
          done
