name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Every entry point resolves
        run: |
          for m in preprocessor train evaluate realtime; do
            python -m ppg_classifier."$m" --help > /dev/null
          done
