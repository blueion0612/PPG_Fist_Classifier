[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-fist-classifier"
description = "Open-hand versus clenched-fist detection from wrist photoplethysmography"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuhyeon Lee" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "scikit-learn>=1.0",
  "pandas>=1.3",
  "joblib>=1.0",
]

[project.optional-dependencies]
# scripts/report_experiment.py, the experiment behind every number in the README
report = ["torch>=1.10", "matplotlib>=3.4"]
# docs/figures/make_hero.py
figures = ["matplotlib>=3.4"]

[project.urls]
Repository = "https://github.com/blueion0612/PPG_Fist_Classifier"
Portfolio = "https://blueion0612.github.io"

[project.scripts]
ppg-preprocess = "ppg_fist_classifier.preprocessor:main"
ppg-train = "ppg_fist_classifier.train:main"
ppg-evaluate = "ppg_fist_classifier.evaluate:main"
ppg-realtime = "ppg_fist_classifier.realtime:main"

[tool.setuptools]
packages = ["ppg_fist_classifier"]

[tool.setuptools.dynamic]
version = { attr = "ppg_fist_classifier.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
